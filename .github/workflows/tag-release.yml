name: Tag release

# Triggered on PR close (checked for merged: true below) rather than push
# to main: a push authored by GITHUB_TOKEN -- including one performed by
# GitHub's auto-merge on a bot-opened PR -- does not fire other workflows'
# `push` events (GitHub's anti-recursion protection). pull_request events
# aren't subject to that restriction, so this fires reliably regardless of
# who or what performed the merge.
on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write # Required to dispatch publish.yml below

jobs:
  tag:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether pubspec.yaml version changed in this merge
        id: check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff "$BASE_SHA" HEAD -- pubspec.yaml | grep -q '^+version:'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag the release commit
        if: steps.check.outputs.changed == 'true'
        id: tag
        run: |
          set -euo pipefail
          V=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"

      # A GITHUB_TOKEN-authored push cannot trigger another workflow's
      # `push` event (GitHub's anti-recursion protection), so publish.yml
      # is dispatched explicitly against the tag we just pushed.
      - name: Trigger publish workflow
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "${{ steps.tag.outputs.tag }}"

      # repo-level delete_branch_on_merge doesn't reliably apply to
      # auto-merge-performed merges, so the release branch is cleaned up
      # explicitly here.
      - name: Delete release branch
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$HEAD_REF"
