name: TEST - poll and merge via GITHUB_TOKEN

# Throwaway workflow to prove the inline poll-and-merge pattern used by
# check-lucide-release.yml works when the merge is performed by a workflow
# run's own GITHUB_TOKEN (not by a human's own credentials, which was the
# flaw in how the earlier tag-release.yml fix was validated). Deleted after
# use.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create harmless test branch and open PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="test/poll-merge-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          echo "" >> CONTRIBUTING.md
          git add CONTRIBUTING.md
          git commit -m "test: poll-and-merge validation (no-op)"
          git push origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base main --head "$BRANCH" \
            --title "test: poll-and-merge validation (no-op)" \
            --body "Throwaway PR to validate the inline poll+merge pattern. Safe to ignore."
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Wait for required checks and merge
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import time

          repo = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["BRANCH"]
          required = {"flutter-analyze", "script-test"}

          sha = subprocess.run(
              ["git", "rev-parse", branch],
              capture_output=True, text=True, check=True,
          ).stdout.strip()

          def approve_pending_runs():
              out = subprocess.run(
                  ["gh", "api", f"repos/{repo}/actions/runs", "-f", f"head_sha={sha}", "--method", "GET"],
                  capture_output=True, text=True, check=True,
              ).stdout
              for run in json.loads(out)["workflow_runs"]:
                  if run["status"] == "action_required":
                      print(f"Approving pending workflow run {run['id']} ({run['name']})")
                      subprocess.run(
                          ["gh", "api", "-X", "POST", f"repos/{repo}/actions/runs/{run['id']}/approve"],
                          check=True,
                      )

          deadline = time.time() + 25 * 60
          while time.time() < deadline:
              approve_pending_runs()
              out = subprocess.run(
                  ["gh", "api", f"repos/{repo}/commits/{sha}/check-runs", "--method", "GET", "-f", "per_page=100"],
                  capture_output=True, text=True, check=True,
              ).stdout
              runs = json.loads(out)["check_runs"]
              by_name = {r["name"]: r for r in runs if r["name"] in required}

              failed = [
                  name for name, r in by_name.items()
                  if r["status"] == "completed"
                  and r["conclusion"] not in ("success", "neutral", "skipped")
              ]
              if failed:
                  print(f"Required check(s) failed: {failed}", file=sys.stderr)
                  sys.exit(1)

              pending = required - {
                  name for name, r in by_name.items() if r["status"] == "completed"
              }
              if not pending:
                  print("All required checks passed.")
                  break

              print(f"Waiting on: {sorted(pending)}")
              time.sleep(15)
          else:
              print("Timed out waiting for required checks.", file=sys.stderr)
              sys.exit(1)

          subprocess.run(
              ["gh", "pr", "merge", branch, "--merge", "--delete-branch"],
              check=True,
          )
          PYEOF

      - name: Confirm merge landed
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          gh pr view "$BRANCH" --repo "$GITHUB_REPOSITORY" --json state,mergedAt,mergedBy
